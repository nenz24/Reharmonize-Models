[project]
name = "reharmonize-models"
version = "0.1.0"
description = "Audio-aware chord suggestion research for SongMapApp"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ipywidgets>=8.1",
  "jupyterlab>=4.4",
  "librosa>=0.11",
  "matplotlib>=3.10",
  "mir-eval>=0.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pretty-midi>=0.2.10",
  "pyyaml>=6.0",
  "scikit-learn>=1.6",
  "soundfile>=0.13",
  "torch>=2.7",
  "torchaudio>=2.7",
  "torchcrepe>=0.0.24",
]

[project.scripts]
reharmonize-detect = "reharmonize_models.btc:main"
reharmonize-dataset = "reharmonize_models.dataset:main"
reharmonize-preprocess = "reharmonize_models.preprocess:main"
reharmonize-qc = "reharmonize_models.quality:main"
reharmonize-build-pretraining = "reharmonize_models.pretraining_data:main"
reharmonize-baselines = "reharmonize_models.evaluation:main"
reharmonize-pretrain = "reharmonize_models.pretraining:main"
reharmonize-separate = "reharmonize_models.separation:main"
reharmonize-train = "reharmonize_models.training:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reharmonize_models"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
